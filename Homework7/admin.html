
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1>Quản lý sản phẩm</h1>
            <a href="index.html">← Quay lại trang bán hàng</a>
        </header>

        <section class="form-section">
            <h2 id="form-title">Thêm sản phẩm</h2>

            <form id="product-form">
                <div class="form-group">
                    <label for="name">Tên sản phẩm</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Nhập tên sản phẩm"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="img">Tên file ảnh</label>
                    <input
                        type="text"
                        id="img"
                        placeholder="Ví dụ: s1.jpeg"
                        required
                    >
                    <small>
                        Ảnh phải nằm cùng thư mục với index.html.
                    </small>
                </div>

                <div class="form-group">
                    <label for="price">Giá sản phẩm (VNĐ)</label>
                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="1"
                        placeholder="Nhập giá sản phẩm"
                        required
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn">
                        Thêm sản phẩm
                    </button>

                    <button type="button" id="cancel-btn" hidden>
                        Hủy sửa
                    </button>
                </div>
            </form>
        </section>

        <section class="table-section">
            <h2>Danh sách sản phẩm</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Mã SP</th>
                            <th>Tên sản phẩm</th>
                            <th>Hình ảnh</th>
                            <th>Giá (VNĐ)</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>

                    <tbody id="product-table"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="admin.js"></script>
</body>
</html>
